<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>身份证上传</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        .page-container {
            max-width: 375px;
            margin: 0 auto;
            background-color: #f5f5f5;
            min-height: 100vh;
            position: relative;
        }

        /* 状态栏 */
        .status-bar {
            height: 44px;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 导航栏 */
        .nav-bar {
            height: 44px;
            background-color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #eee;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-left span {
            font-size: 18px;
            color: #333;
            cursor: pointer;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }


        /* 内容区域 */
        .content-container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-card {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .header {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }

        .tips {
            background-color: #f8f9fa;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .tips p {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .tips p:first-child {
            font-weight: 600;
            color: #333;
        }

        /* 上传表单 */
        .upload-form {
            margin-bottom: 20px;
        }

        .form-item {
            margin-bottom: 20px;
        }

        .form-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .label-text {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        .example-btn {
            background-color: #ff9500;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
        }

        .example-btn:hover {
            background-color: #e6850e;
        }

        /* 上传区域 */
        .upload-area {
            width: 100%;
            height: 200px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            background-color: #fafafa;
        }

        .upload-area:hover {
            border-color: #4095f0;
            background-color: #f0f8ff;
        }

        .upload-area.has-image {
            border-style: solid;
            border-color: #4095f0;
        }

        .default-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.3;
            filter: blur(2px);
        }

        .upload-icon {
            width: 40px;
            height: 40px;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .upload-text {
            font-size: 14px;
            color: #666;
            position: relative;
            z-index: 1;
        }

        .uploaded-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
        }

        /* 身份证示例 */
        .sign-example {
            margin-top: 20px;
        }

        .example-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .example-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .example-item {
            text-align: center;
        }

        .example-image {
            width: 100%;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 5px;
        }

        .example-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 2px;
        }

        .example-status {
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 2px;
        }

        .status-correct {
            background-color: #e8f5e8;
            color: #52c41a;
        }

        .status-wrong {
            background-color: #fff2f0;
            color: #ff4d4f;
        }

        /* 底部按钮 */
        .order-footer {
            background-color: #fff;
            padding: 20px;
            border-top: 1px solid #e5e5e5;
        }

        .btn {
            width: 100%;
            height: 44px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn.primary {
            background-color: #4095f0;
            color: #fff;
        }

        .btn.primary:hover {
            background-color: #3a87d9;
        }

        .btn.primary:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* 示例弹窗 */
        .example-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .example-modal.show {
            display: flex;
        }

        .modal-content {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            margin: 20px;
            max-width: 300px;
            width: 100%;
        }

        .modal-header {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .modal-text {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            text-align: center;
        }

        .modal-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .modal-btn {
            width: 100%;
            height: 40px;
            background-color: #4095f0;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        /* 订购指南入口 */
        .guide-entry {
            background-color: #fff;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #e9ecef;
        }

        .guide-entry:hover {
            background-color: #f8f9fa;
            border-color: #4095f0;
        }

        .guide-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .guide-icon {
            width: 24px;
            height: 24px;
            background-color: #4095f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .guide-text {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        .guide-arrow {
            color: #999;
            font-size: 16px;
        }

        /* 指南弹窗 */
        .guide-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .guide-modal.show {
            display: flex;
        }

        .guide-modal-content {
            background-color: #fff;
            border-radius: 12px;
            padding: 20px;
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .guide-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .guide-modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .guide-modal-close {
            width: 30px;
            height: 30px;
            background-color: #f5f5f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: #666;
        }

        .guide-modal-close:hover {
            background-color: #e9ecef;
        }

        .guide-modal-image {
            width: 100%;
            max-width: 300px;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }

        /* 响应式调整 */
        @media (max-width: 375px) {
            .content-container {
                padding: 15px;
            }
            
            .form-card {
                padding: 15px;
            }
            
            .upload-area {
                height: 180px;
            }

            .guide-entry {
                padding: 12px 15px;
            }

            .guide-text {
                font-size: 15px;
            }
        }
    </style>
</head>

    <script>
        let frontImage = null;
        let backImage = null;

        // 页面加载完成
        document.addEventListener('DOMContentLoaded', function() {
            console.log('身份证上传页面已加载');
            updateNextButton();
        });

        // 返回上一页
        function goBack() {
            console.log('返回上一页');
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'closeIdUploadModal' }, '*');
            } else {
                window.history.back();
            }
        }

        // 关闭页面
        function closePage() {
            console.log('关闭页面');
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'closeIdUploadModal' }, '*');
            } else {
                window.close();
            }
        }

        // 选择图片
        function selectImage(type) {
            console.log('选择图片:', type);
            
            // 创建文件输入元素
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.style.display = 'none';
            
            input.onchange = function(event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        displayImage(type, e.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };
            
            document.body.appendChild(input);
            input.click();
            document.body.removeChild(input);
        }

        // 显示图片
        function displayImage(type, imageData) {
            const uploadArea = document.getElementById(type + 'Upload');
            uploadArea.innerHTML = `
                <img src="${imageData}" alt="上传的图片" class="uploaded-image">
            `;
            uploadArea.classList.add('has-image');
            
            if (type === 'front') {
                frontImage = imageData;
            } else {
                backImage = imageData;
            }
            
            updateNextButton();
        }

        // 显示示例
        function showExample(type) {
            console.log('显示示例:', type);
            const modal = document.getElementById('exampleModal');
            const modalText = document.getElementById('modalText');
            const modalImage = document.getElementById('modalImage');
            
            if (type === 'front') {
                modalText.textContent = '上传身份证正面照（请尽量摆正）';
            } else {
                modalText.textContent = '上传身份证反面照';
            }
            
            modal.classList.add('show');
        }

        // 关闭示例弹窗
        function closeExample() {
            const modal = document.getElementById('exampleModal');
            modal.classList.remove('show');
        }

        // 更新下一步按钮状态
        function updateNextButton() {
            const nextBtn = document.getElementById('nextBtn');
            // 按钮默认就可以点击，用于测试流程
            nextBtn.disabled = false;
            nextBtn.style.backgroundColor = '#4095f0';
        }

        // 下一步
        function nextStep() {
            console.log('进入下一步');
            
            // 跳转到合同上传页面
            if (window.parent !== window) {
                window.parent.postMessage({ 
                    type: 'idUploadCompleted',
                    data: {
                        frontImage: frontImage || 'test_front_image',
                        backImage: backImage || 'test_back_image'
                    }
                }, '*');
            } else {
                // 如果不在iframe中，直接跳转
                window.location.href = '合同上传.html';
            }
        }

        // 显示操作指南
        function showGuide() {
            console.log('显示操作指南');
            const modal = document.getElementById('guideModal');
            modal.classList.add('show');
        }

        // 关闭操作指南
        function closeGuide() {
            console.log('关闭操作指南');
            const modal = document.getElementById('guideModal');
            modal.classList.remove('show');
        }

        // 点击弹窗外部关闭
        document.getElementById('exampleModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeExample();
            }
        });

        // 点击指南弹窗外部关闭
        document.getElementById('guideModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeGuide();
            }
        });
    </script>
</body>
</html>
