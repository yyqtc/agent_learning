<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合同上传</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        .page-container {
            max-width: 375px;
            margin: 0 auto;
            background-color: #f5f5f5;
            min-height: 100vh;
            position: relative;
        }

        /* 状态栏 */
        .status-bar {
            height: 44px;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 导航栏 */
        .nav-bar {
            height: 44px;
            background-color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #eee;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-left span {
            font-size: 18px;
            color: #333;
            cursor: pointer;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }


        /* 内容区域 */
        .content-container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        /* 基本信息部分 */
        .basic-info-section {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background-color: #4095f0;
            margin-right: 8px;
            border-radius: 2px;
        }

        .form-item {
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 14px;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .required {
            color: #ff4d4f;
            margin-right: 4px;
        }

        .form-input {
            width: 100%;
            height: 44px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 16px;
            color: #333;
            background-color: #fff;
        }

        .form-input:focus {
            border-color: #4095f0;
            outline: none;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .radio-input {
            width: 18px;
            height: 18px;
            border: 2px solid #d9d9d9;
            border-radius: 50%;
            margin-right: 8px;
            position: relative;
            transition: all 0.3s ease;
        }

        .radio-input.checked {
            border-color: #4095f0;
        }

        .radio-input.checked::after {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #4095f0;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .radio-label {
            font-size: 16px;
            color: #333;
        }

        /* 套餐信息部分 */
        .package-section {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .package-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        .package-item {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .package-info {
            flex: 1;
        }

        .package-name {
            font-size: 14px;
            color: #333;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .package-spec {
            font-size: 13px;
            color: #666;
        }

        .package-count {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        /* 签约信息部分 */
        .signing-section {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .signing-method {
            margin-bottom: 20px;
        }

        .method-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .tutorial-btn {
            background-color: #4095f0;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tutorial-btn:hover {
            background-color: #3a87d9;
        }

        .signing-options {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .signing-option {
            flex: 1;
            height: 50px;
            border: 2px solid #d9d9d9;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #fff;
        }

        .signing-option.active {
            border-color: #4095f0;
            background-color: #4095f0;
            color: #fff;
        }

        .signing-option:not(.active) {
            color: #666;
        }

        .offline-contact {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 10px;
        }

        .contact-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
        }

        .contact-text {
            font-size: 12px;
            color: #666;
        }

        /* 业务流程提醒 */
        .process-reminder {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 15px;
        }

        .reminder-title {
            font-size: 14px;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .reminder-content {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        .highlight {
            color: #4095f0;
            font-weight: 600;
        }

        /* 底部按钮 */
        .footer {
            background-color: #fff;
            padding: 20px;
            border-top: 1px solid #eee;
        }

        .btn-confirm {
            width: 100%;
            height: 48px;
            background-color: #4095f0;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-confirm:hover {
            background-color: #3a87d9;
        }

        .btn-confirm:active {
            transform: scale(0.98);
        }

        /* 操作指南入口 */
        .guide-entry {
            background-color: #fff;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #e9ecef;
        }

        .guide-entry:hover {
            background-color: #f8f9fa;
            border-color: #4095f0;
        }

        .guide-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .guide-icon {
            width: 24px;
            height: 24px;
            background-color: #4095f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .guide-text {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }

        .guide-arrow {
            color: #999;
            font-size: 16px;
        }

        /* 指南弹窗 */
        .guide-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .guide-modal.show {
            display: flex;
        }

        .guide-modal-content {
            background-color: #fff;
            border-radius: 12px;
            padding: 20px;
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }

        .guide-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .guide-modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .guide-modal-close {
            width: 30px;
            height: 30px;
            background-color: #f5f5f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: #666;
        }

        .guide-modal-close:hover {
            background-color: #e9ecef;
        }

        .guide-modal-image {
            width: 100%;
            max-width: 300px;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }

        /* 响应式调整 */
        @media (max-width: 375px) {
            .content-container {
                padding: 15px;
            }
            
            .basic-info-section,
            .package-section,
            .signing-section {
                padding: 15px;
            }

            .guide-entry {
                padding: 12px 15px;
            }

            .guide-text {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="status-left">
                <span>14:44</span>
            </div>
            <div class="status-right">
                <span>📶</span>
                <span>5G</span>
                <span>🔋 29%</span>
            </div>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="nav-left">
                <span onclick="goBack()">←</span>
                <span onclick="closePage()">×</span>
            </div>
            <div class="nav-title">合同签订</div>
            <div></div>
        </div>


        <!-- 内容区域 -->
        <div class="content-container">
            <!-- 操作指南入口 -->
            <div class="guide-entry" onclick="showGuide()">
                <div class="guide-left">
                    <div class="guide-icon">📋</div>
                    <div class="guide-text">操作指南</div>
                </div>
                <div class="guide-arrow">></div>
            </div>

            <!-- 基本信息部分 -->
            <div class="basic-info-section">
                <div class="section-title">基本信息</div>
                
                <div class="form-item">
                    <div class="form-label">
                        <span class="required">*</span>
                        证件号码
                    </div>
                    <input type="text" class="form-input" value="441283199410183600" readonly>
                </div>

                <div class="form-item">
                    <div class="form-label">
                        <span class="required">*</span>
                        电话 (供安装师傅上门联系)
                    </div>
                    <input type="tel" class="form-input" value="13802882241" readonly>
                </div>

                <div class="form-item">
                    <div class="form-label">
                        <span class="required">*</span>
                        经办人是否为法人
                    </div>
                    <div class="radio-group">
                        <div class="radio-item" onclick="selectRadio('yes')">
                            <div class="radio-input checked" id="radioYes"></div>
                            <span class="radio-label">是</span>
                        </div>
                        <div class="radio-item" onclick="selectRadio('no')">
                            <div class="radio-input" id="radioNo"></div>
                            <span class="radio-label">否</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 套餐信息部分 -->
            <div class="package-section">
                <div class="package-title">移动到企套餐(1)</div>
                <div class="package-item">
                    <div class="package-info">
                        <div class="package-name">移动到企 (行业版)</div>
                        <div class="package-spec">169 月包</div>
                    </div>
                    <div class="package-count">1套</div>
                </div>
            </div>

            <!-- 签约信息部分 -->
            <div class="signing-section">
                <div class="section-title">签约信息</div>
                
                <div class="signing-method">
                    <div class="method-label">
                        <div class="form-label">
                            <span class="required">*</span>
                            签约方式
                        </div>
                        <button class="tutorial-btn" onclick="showTutorial()">
                            📄 点击查看签约教程
                        </button>
                    </div>
                    
                    <div class="signing-options">
                        <div class="signing-option active" id="onlineSigning" onclick="selectSigningMethod('online')">
                            线上签约
                        </div>
                        <div class="signing-option" id="offlineSigning" onclick="selectSigningMethod('offline')">
                            线下签约
                            <div class="offline-contact">
                                <div class="contact-avatar">👤</div>
                                <div class="contact-text">联系客户经理</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 业务流程提醒 -->
                <div class="process-reminder">
                    <div class="reminder-title">业务流程提醒：</div>
                    <div class="reminder-content">
                        <span class="highlight">法人</span>：点击确认>等待短信签约>提交提单
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="footer">
            <button class="btn-confirm" onclick="confirmSigning()">确认</button>
        </div>
    </div>

    <!-- 操作指南弹窗 -->
    <div class="guide-modal" id="guideModal">
        <div class="guide-modal-content">
            <div class="guide-modal-header">
                <div class="guide-modal-title">操作指南</div>
                <div class="guide-modal-close" onclick="closeGuide()">×</div>
            </div>
            <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAwIiBoZWlnaHQ9IjQwMCIgdmlld0JveD0iMCAwIDMwMCA0MDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIzMDAiIGhlaWdodD0iNDAwIiBmaWxsPSIjZjBmMGYwIi8+Cjx0ZXh0IHg9IjE1MCIgeT0iMjAwIiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTYiIGZpbGw9IiM2NjYiIHRleHQtYW5jaG9yPSJtaWRkbGUiPuWKoOi9veWkuei0pTwvdGV4dD4KPC9zdmc+Cg==" alt="操作指南图片" class="guide-modal-image">
        </div>
    </div>

    <script>
        let selectedAgent = 'yes';
        let selectedSigningMethod = 'online';

        // 页面加载完成
        document.addEventListener('DOMContentLoaded', function() {
            console.log('合同上传页面已加载');
        });

        // 返回上一页
        function goBack() {
            console.log('返回上一页');
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'closeContractUploadModal' }, '*');
            } else {
                window.history.back();
            }
        }

        // 关闭页面
        function closePage() {
            console.log('关闭页面');
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'closeContractUploadModal' }, '*');
            } else {
                window.close();
            }
        }

        // 选择经办人是否为法人
        function selectRadio(type) {
            selectedAgent = type;
            
            const radioYes = document.getElementById('radioYes');
            const radioNo = document.getElementById('radioNo');
            
            if (type === 'yes') {
                radioYes.classList.add('checked');
                radioNo.classList.remove('checked');
            } else {
                radioYes.classList.remove('checked');
                radioNo.classList.add('checked');
            }
            
            // 更新业务流程提醒
            updateProcessReminder();
        }

        // 选择签约方式
        function selectSigningMethod(method) {
            selectedSigningMethod = method;
            
            const onlineSigning = document.getElementById('onlineSigning');
            const offlineSigning = document.getElementById('offlineSigning');
            
            if (method === 'online') {
                onlineSigning.classList.add('active');
                offlineSigning.classList.remove('active');
            } else {
                onlineSigning.classList.remove('active');
                offlineSigning.classList.add('active');
            }
            
            // 更新业务流程提醒
            updateProcessReminder();
        }

        // 更新业务流程提醒
        function updateProcessReminder() {
            const reminderContent = document.querySelector('.reminder-content');
            
            if (selectedAgent === 'yes') {
                if (selectedSigningMethod === 'online') {
                    reminderContent.innerHTML = '<span class="highlight">法人</span>：点击确认>等待短信签约>提交提单';
                } else {
                    reminderContent.innerHTML = '<span class="highlight">法人</span>：点击确认>线下签约>提交提单';
                }
            } else {
                if (selectedSigningMethod === 'online') {
                    reminderContent.innerHTML = '<span class="highlight">经办人</span>：点击确认>法人短信授权>经办人短信签约>提交订单';
                } else {
                    reminderContent.innerHTML = '<span class="highlight">经办人</span>：点击确认>线下签约>提交订单';
                }
            }
        }

        // 显示签约教程
        function showTutorial() {
            alert('这里可以显示签约教程或跳转到教程页面');
        }

        // 显示操作指南
        function showGuide() {
            console.log('显示操作指南');
            const modal = document.getElementById('guideModal');
            modal.classList.add('show');
        }

        // 关闭操作指南
        function closeGuide() {
            console.log('关闭操作指南');
            const modal = document.getElementById('guideModal');
            modal.classList.remove('show');
        }

        // 确认签约
        function confirmSigning() {
            console.log('确认签约');
            console.log('经办人是否为法人:', selectedAgent);
            console.log('签约方式:', selectedSigningMethod);
            
            // 这里可以添加表单验证逻辑
            if (!selectedAgent || !selectedSigningMethod) {
                alert('请完善所有必填信息');
                return;
            }
            
            // 跳转到提交成功页面
            if (window.parent !== window) {
                window.parent.postMessage({ 
                    type: 'contractUploadCompleted',
                    data: {
                        agent: selectedAgent,
                        signingMethod: selectedSigningMethod
                    }
                }, '*');
            } else {
                // 如果不在iframe中，可以跳转到下一个页面
                alert('签约信息已确认，进入提交成功页面');
            }
        }

        // 点击指南弹窗外部关闭
        document.getElementById('guideModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeGuide();
            }
        });
    </script>
</body>
</html>
