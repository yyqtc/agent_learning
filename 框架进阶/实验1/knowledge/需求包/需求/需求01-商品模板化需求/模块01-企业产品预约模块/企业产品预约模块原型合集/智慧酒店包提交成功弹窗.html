<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧酒店包 - 提交成功</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #fff;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        /* 导航栏 */
        .nav-bar {
            height: 44px;
            background-color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #eee;
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 375px;
            z-index: 1000;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-left span {
            font-size: 18px;
            color: #333;
            cursor: pointer;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            max-width: 375px;
            margin: 0 auto;
            background-color: #fff;
            position: relative;
            padding-top: 44px;
            padding-bottom: 160px;
        }

        .bd {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bd image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            margin-bottom: 22px;
        }

        .bd-btn {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 46px 20px;
            background-color: rgba(255, 255, 255);
        }

        .u-btn {
            border-radius: 7px;
            min-width: 140px;
            height: 44px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .u-btn:hover {
            opacity: 0.8;
        }

        .u-btn:active {
            transform: scale(0.98);
        }

        .u-btn.primary {
            background-color: #4095F0;
            border: none;
            color: white;
        }

        .u-btn.secondary {
            background-color: white;
            border: 1px solid #4095F0;
            color: #4095F0;
        }

        /* 响应式调整 */
        @media (max-width: 375px) {
            .container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <div class="nav-bar">
        <div class="nav-left">
            <span onclick="goBack()">←</span>
            <span onclick="closePage()">×</span>
        </div>
        <div class="nav-title">预约成功</div>
        <div></div>
    </div>

    <div class="container">
        <div class="bd">
            <image src="预约成功.png" mode="widthFix" />
        </div>
        <div class="bd-btn">
            <button class="u-btn secondary" onclick="redirectToHome()">返回首页</button>
            <button class="u-btn primary" onclick="onTheWay()">查询在途订单</button>
        </div>
    </div>

    <script>
        // 返回上一页
        function goBack() {
            console.log('返回上一页');
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'closeSuccessModal' }, '*');
            } else {
                window.history.back();
            }
        }

        // 关闭页面
        function closePage() {
            console.log('关闭页面');
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'closeSuccessModal' }, '*');
            } else {
                window.close();
            }
        }

        // 返回首页
        function redirectToHome() {
            console.log('返回首页');
            
            // 通知父窗口关闭成功弹窗
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'closeSuccessModal' }, '*');
            } else {
                // 如果不在iframe中，直接关闭窗口
                window.close();
            }
        }

        // 查询在途订单
        function onTheWay() {
            console.log('查询在途订单');
            
            // 通知父窗口关闭成功弹窗并跳转到在途订单页面
            if (window.parent !== window) {
                window.parent.postMessage({ 
                    type: 'closeSuccessModal',
                    action: 'redirectToOnOrder'
                }, '*');
            } else {
                // 如果不在iframe中，直接跳转
                window.location.href = '智慧酒店包在途订单页面.html';
            }
        }

        // 页面加载完成
        document.addEventListener('DOMContentLoaded', function() {
            console.log('智慧酒店包提交成功弹窗页面已加载');
        });
    </script>
</body>
</html>
