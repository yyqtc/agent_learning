<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧酒店包 - 规格选择弹窗</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        .page-container {
            max-width: 375px;
            margin: 0 auto;
            background-color: #fff;
            min-height: 100vh;
            position: relative;
        }

        /* 弹窗遮罩 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        /* 弹窗主体 */
        .popup-container {
            background-color: white;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 375px;
            max-height: 80vh;
            overflow: hidden;
            animation: slideUpFromBottom 0.3s ease-out;
        }

        @keyframes slideUpFromBottom {
            from { 
                transform: translateY(100%); 
                opacity: 0;
            }
            to { 
                transform: translateY(0); 
                opacity: 1;
            }
        }

        /* 头部价格栏 */
        .header {
            background-color: #fff;
            color: #333;
            padding: 15px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .price-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .product-thumbnail {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #e0e0e0;
        }

        .product-name {
            font-size: 34rpx;
            font-weight: 500;
        }

        .price-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .price {
            color: #e74c3c;
            font-size: 48rpx;
            font-weight: bold;
        }

        .close-btn {
            position: absolute;
            right: 22px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-icon {
            font-size: 20px;
            color: #666;
        }

        /* 内容区域 */
        .content-area {
            max-height: 60vh;
            overflow-y: auto;
            padding: 15px 20px;
        }

        /* 套餐类型选择 */
        .packets {
            display: flex;
            align-items: end;
            margin-bottom: 20px;
            gap: 30px;
        }

        .packet-btn {
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .month {
            width: 79px;
            height: 32px;
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        .month.active {
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 79 32"><rect width="79" height="32" rx="16" fill="%233c7bfd"/><text x="39.5" y="20" text-anchor="middle" fill="white" font-size="14" font-weight="600">月包</text></svg>');
        }

        .month:not(.active) {
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 79 32"><rect width="79" height="32" rx="16" fill="%23f2f6f9" stroke="%23e0e0e0" stroke-width="1"/><text x="39.5" y="20" text-anchor="middle" fill="%23333" font-size="14" font-weight="600">月包</text></svg>');
        }

        .year {
            width: 91px;
            height: 32px;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            position: relative;
        }

        .year.active {
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 91 32"><rect width="91" height="32" rx="16" fill="%233c7bfd"/><text x="45.5" y="20" text-anchor="middle" fill="white" font-size="14" font-weight="600">年包</text></svg>');
        }

        .year:not(.active) {
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 91 32"><rect width="91" height="32" rx="16" fill="%23f2f6f9" stroke="%23e0e0e0" stroke-width="1"/><text x="45.5" y="20" text-anchor="middle" fill="%23333" font-size="14" font-weight="600">年包</text></svg>');
        }

        .year.disabled {
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 91 32"><rect width="91" height="32" rx="16" fill="%23d7d7d7"/><text x="45.5" y="20" text-anchor="middle" fill="%23999" font-size="14" font-weight="600">年包</text></svg>');
            pointer-events: none;
            opacity: 0.6;
        }

        .promo-tag {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #ff4444;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* 价格选择 */
        .filter-item {
            margin-bottom: 25px;
        }

        .filter-item .label {
            display: block;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 16px;
            color: #333;
            text-align: left;
        }

        .filter-title {
            display: block;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 16px;
            color: #333;
            text-align: left;
        }

        .options-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: flex-start;
        }

        .option {
            padding: 8px 12px;
            background-color: #f5f5f5;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 50px;
            text-align: center;
            position: relative;
            border: 2px solid transparent;
        }

        .option.isActive {
            background-color: #4aa4ea;
            color: white;
            border-color: #4aa4ea;
        }

        .option:hover:not(.isActive) {
            background-color: #e8f4fd;
            border-color: #4aa4ea;
        }

        .option.disabled {
            pointer-events: none;
            background-color: #d7d7d7;
            color: #999;
        }

        .option .name {
            font-size: 12px;
            font-weight: 500;
        }

        /* 规格选择 */
        .label {
            display: block;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }


        /* 底部按钮 */
        .footer {
            border-top: 2rpx solid #ebebeb;
            padding: 20px 30px;
            text-align: center;
        }

        .btn-submit {
            width: 100%;
            height: 44px;
            background-color: #007AFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #0056CC;
        }

        .btn-submit:active {
            background-color: #004499;
        }

        /* 信息填写弹窗 */
        .info-form-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        @media (max-width: 375px) {
            .info-form-content {
                max-width: 100%;
                border-radius: 20px 20px 0 0;
            }
        }

        .info-form-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .info-form-content {
            background: white;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 375px;
            margin: 0 auto;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .info-form-modal.show .info-form-content {
            transform: translateY(0);
        }

        .info-form-header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 15px 20px 10px;
            border-bottom: 1px solid #f0f0f0;
            position: relative;
        }

        .info-form-header::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
        }

        .info-form-header .close-btn {
            width: 30px;
            height: 30px;
            border: none;
            background: #f5f5f5;
            border-radius: 50%;
            font-size: 18px;
            color: #666;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }

        .info-form-body {
            flex: 1;
            padding: 15px 20px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            min-width: 0;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            min-width: 60px;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .form-inputs {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
        }

        .form-select {
            height: 40px;
            padding: 0 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fafafa;
            min-width: 80px;
        }

        .address-input-wrapper {
            position: relative;
            flex: 1;
        }

        .location-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
        }

        .form-input-small {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fafafa;
            box-sizing: border-box;
        }

        .separator {
            font-size: 16px;
            color: #666;
            margin: 0 4px;
        }

        .form-hints {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            padding-left: 68px;
        }

        .hint {
            font-size: 12px;
            color: #999;
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* 已选择的产品信息 */
        .selected-product-info {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .product-header {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .product-image {
            flex-shrink: 0;
        }

        .product-img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
        }

        .product-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }


        .product-price {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .current-price {
            font-size: 18px;
            font-weight: 600;
            color: #e74c3c;
        }

        .packet-type {
            font-size: 14px;
            color: #666;
            margin-left: 8px;
        }

        .detail-section {
            border-top: 1px solid #f0f0f0;
            padding-top: 15px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .spec-items {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .spec-label {
            font-size: 12px;
            color: #999;
        }

        .spec-value {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        .required {
            color: #ff4757;
        }

        .form-input {
            flex: 1;
            height: 40px;
            padding: 0 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fafafa;
            box-sizing: border-box;
        }

        .form-input-half {
            flex: 1;
            height: 40px;
            padding: 0 8px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fafafa;
            box-sizing: border-box;
            margin-left: 2px;
            min-width: 0;
        }

        .form-input:focus,
        .form-input-half:focus {
            outline: none;
            border-color: #3c7bfd;
            background-color: white;
        }

        .form-textarea {
            width: 100%;
            min-height: 70px;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fafafa;
            resize: none;
            box-sizing: border-box;
            font-family: inherit;
        }

        .form-textarea:focus {
            outline: none;
            border-color: #3c7bfd;
            background-color: white;
        }

        .info-form-footer {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            border-top: 1px solid #f0f0f0;
            background: white;
        }

        .price-display {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 12px;
        }

        .total-price {
            font-size: 18px;
            color: #e74c3c;
            font-weight: 600;
        }

        .btn-confirm {
            flex: 2;
            height: 40px;
            background: linear-gradient(135deg, #3c7bfd 0%, #5a8cff 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-confirm:active {
            transform: scale(0.98);
        }

        /* 成功弹窗 */
        .success-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .success-modal.show {
            display: flex;
        }

        .success-content {
            background-color: white;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            max-width: 300px;
            width: 90%;
            transform: scale(1);
            animation: scaleInSuccess 0.3s ease-out;
        }

        @keyframes scaleInSuccess {
            from { 
                transform: scale(0.8);
                opacity: 0;
            }
            to { 
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .success-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .success-btn {
            width: 100%;
            height: 36px;
            background-color: #007AFF;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        /* 响应式设计 */
        @media (max-width: 375px) {
            .page-container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- 弹窗遮罩 -->
        <div class="modal-overlay">
            <!-- 弹窗主体 -->
            <div class="popup-container">
                <!-- 头部价格栏 -->
                <div class="header">
                    <div class="price-bar">
                        <img src="banner.jpg" alt="智慧酒店包" class="product-thumbnail">
                        <div class="price-section">
                            <span class="price">￥40</span>
                        </div>
                    </div>
                    <div class="close-btn" onclick="closeModal()">
                        <span class="close-icon">×</span>
                    </div>
                </div>

                <!-- 内容区域 -->
                <div class="content-area">
                    <!-- 套餐类型选择 -->
                    <div class="packets">
                        <div class="packet-btn month active" onclick="selectPacketType('month', this)"></div>
                        <div class="packet-btn year" onclick="selectPacketType('year', this)">
                            <span class="promo-tag">抢</span>
                        </div>
                    </div>

                    <!-- 价格选择 -->
                    <div class="filter-item">
                        <span class="label">价格</span>
                        <div class="options-list" id="priceOptions">
                            <!-- 价格选项将通过JavaScript动态生成 -->
                        </div>
                    </div>

                    <!-- 带宽选择 -->
                    <div class="filter-item">
                        <span class="label">带宽</span>
                        <div class="options-list">
                            <div class="option isActive" onclick="selectBandwidth('100M', this)">
                                <span class="name">100M</span>
                            </div>
                            <div class="option" onclick="selectBandwidth('200M', this)">
                                <span class="name">200M</span>
                            </div>
                            <div class="option" onclick="selectBandwidth('300M', this)">
                                <span class="name">300M</span>
                            </div>
                            <div class="option" onclick="selectBandwidth('600M', this)">
                                <span class="name">600M</span>
                            </div>
                            <div class="option" onclick="selectBandwidth('1000M', this)">
                                <span class="name">1000M</span>
                            </div>
                        </div>
                    </div>

                    <!-- 电视选择 -->
                    <div class="filter-item">
                        <span class="label">电视</span>
                        <div class="options-list">
                            <div class="option isActive" onclick="selectTV('商务电视IPTV', this)">
                                <span class="name">商务电视IPTV</span>
                            </div>
                        </div>
                    </div>

                    <!-- 屏幕定制选择 -->
                    <div class="filter-item">
                        <span class="label">屏幕定制</span>
                        <div class="options-list">
                            <div class="option isActive" onclick="selectScreen('屏幕定制标准版', this)">
                                <span class="name">屏幕定制标准版</span>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- 底部按钮 -->
                <div class="footer">
                    <button class="btn-submit" onclick="submitReservation()">确认</button>
                </div>
            </div>
        </div>

        <!-- 信息填写弹窗 -->
        <div class="info-form-modal" id="infoFormModal">
            <div class="info-form-content">
                <div class="info-form-header">
                    <div></div>
                    <button class="close-btn" onclick="closeInfoForm()">×</button>
                </div>
                
                <div class="info-form-body">
                    <div class="form-group">
                        <div class="form-row">
                            <label class="form-label">安装地址 <span class="required">*</span></label>
                            <div class="form-inputs">
                                <select class="form-select" id="citySelect">
                                    <option value="">广州市</option>
                                </select>
                                <div class="address-input-wrapper">
                                    <input type="text" class="form-input" id="installAddress" placeholder="输入地址选择楼宇" value="测试楼宇">
                                    <span class="location-icon">📍</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="form-row">
                            <label class="form-label">详细地址 <span class="required">*</span></label>
                            <div class="form-inputs">
                                <input type="text" class="form-input-small" id="buildingInput" placeholder="例: 6栋" value="6栋">
                                <span class="separator">-</span>
                                <input type="text" class="form-input-small" id="roomInput" placeholder="例: 203号" value="601">
                            </div>
                        </div>
                        <div class="form-hints">
                            <span class="hint">请选择具体楼宇</span>
                            <span class="hint">请填写楼层/门牌号</span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="form-row">
                            <label class="form-label">姓名 <span class="required">*</span></label>
                            <input type="text" class="form-input-half" id="customerName" placeholder="请输入姓名" value="测试用户">
                            <label class="form-label">电话 <span class="required">*</span></label>
                            <input type="tel" class="form-input-half" id="customerPhone" placeholder="请输入联系电话" value="13802882241">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">备注</label>
                        <textarea class="form-textarea" id="customerRemark" placeholder="请输入备注信息（可选）"></textarea>
                    </div>

                    <!-- 已选择的产品信息 -->
                    <div class="selected-product-info">
                        <div class="product-header">
                            <div class="product-image">
                                <img src="banner.jpg" alt="智慧酒店包" class="product-img">
                            </div>
                            <div class="product-info">
                                <div class="product-name">智慧酒店包</div>
                                <div class="product-price">
                                    <span class="current-price" id="selectedPrice">¥40</span>
                                    <span class="packet-type" id="selectedSpec">月包</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="product-details">
                            <div class="detail-section">
                                <div class="section-title">已选规格</div>
                                <div class="spec-items">
                                    <div class="spec-item">
                                        <span class="spec-label">套餐类型</span>
                                        <span class="spec-value" id="selectedPacketType">月包</span>
                                    </div>
                                    <div class="spec-item">
                                        <span class="spec-label">带宽</span>
                                        <span class="spec-value" id="selectedBandwidth">100M</span>
                                    </div>
                                    <div class="spec-item">
                                        <span class="spec-label">电视</span>
                                        <span class="spec-value" id="selectedTV">商务电视IPTV</span>
                                    </div>
                                    <div class="spec-item">
                                        <span class="spec-label">屏幕定制</span>
                                        <span class="spec-value" id="selectedScreen">屏幕定制标准版</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="info-form-footer">
                    <div class="price-display">
                        <span class="total-price" id="totalPrice">¥40月套餐</span>
                    </div>
                    <button class="btn-confirm" onclick="submitInfoForm()">提交预约</button>
                </div>
            </div>
        </div>

        <!-- 成功弹窗 -->
        <div class="success-modal" id="successModal">
            <div class="success-content">
                <div class="success-title">提交成功</div>
                <div class="success-desc">请耐心等候，感谢您的支持！</div>
                <button class="success-btn" onclick="closeSuccessModal()">返回首页</button>
            </div>
        </div>
    </div>

    <script>
        // 当前选择的数据
        let currentSelection = {
            packetType: 'month',
            price: 40,
            bandwidth: '100M',
            tv: '商务电视IPTV',
            screen: '屏幕定制标准版'
        };

        // SKU规格联动配置
        const skuConfig = {
            'month': {
                '40': ['100M'],
                '50': ['200M'],
                '80': ['300M'],
                '100': ['600M'],
                '120': ['1000M']
            },
            'year': {
                '400': ['100M'],
                '500': ['200M'],
                '800': ['300M'],
                '1000': ['600M'],
                '1200': ['1000M']
            }
        };

        // 选择套餐类型
        function selectPacketType(type, element) {
            // 移除所有active类
            document.querySelectorAll('.packet-btn').forEach(btn => btn.classList.remove('active'));
            // 添加active类到当前按钮
            element.classList.add('active');
            
            currentSelection.packetType = type;
            
            // 更新价格选项
            updatePriceOptions();
            
            // 更新带宽选项状态
            updateBandwidthOptions();
        }

        // 更新价格选项
        function updatePriceOptions() {
            console.log('=== 开始更新价格选项 ===');
            const priceOptionsContainer = document.getElementById('priceOptions');
            console.log('价格选项容器:', priceOptionsContainer);
            
            if (!priceOptionsContainer) {
                console.error('未找到价格选项容器!');
                return;
            }
            
            const currentPackageType = currentSelection.packetType;
            console.log('当前套餐类型:', currentPackageType);
            
            // 根据套餐类型获取价格列表
            const prices = currentPackageType === 'month' 
                ? ['40', '50', '80', '100', '120']
                : ['400', '500', '800', '1000', '1200'];
            
            console.log('价格列表:', prices);
            
            // 清空现有选项
            priceOptionsContainer.innerHTML = '';
            
            // 生成新的价格选项
            prices.forEach((price, index) => {
                const option = document.createElement('div');
                option.className = `option ${index === 0 ? 'isActive' : ''}`;
                option.onclick = () => selectPrice(parseInt(price), option);
                option.innerHTML = `<span class="name">￥${price}</span>`;
                priceOptionsContainer.appendChild(option);
                console.log('添加价格选项:', price);
            });
            
            // 更新当前选择的价格
            currentSelection.price = parseInt(prices[0]);
            
            // 更新头部价格显示
            const priceElement = document.querySelector('.price');
            if (priceElement) {
                priceElement.textContent = '￥' + prices[0];
            }
            
            console.log('价格选项更新完成，共添加', prices.length, '个选项');
        }

        // 选择价格
        function selectPrice(price, element) {
            console.log('选择价格:', price);
            
            // 移除所有价格选项的active类
            const priceContainer = element.closest('.filter-item');
            priceContainer.querySelectorAll('.option').forEach(btn => btn.classList.remove('isActive'));
            // 添加active类到当前按钮
            element.classList.add('isActive');
            
            // 更新价格显示
            document.querySelector('.price').textContent = '￥' + price;
            currentSelection.price = price;
            
            // 更新带宽选项状态
            updateBandwidthOptions();
        }

        // 选择带宽
        function selectBandwidth(bandwidth, element) {
            // 检查当前带宽是否可用
            if (element.classList.contains('disabled')) {
                return;
            }
            
            // 移除所有带宽选项的active类
            const bandwidthContainer = element.closest('.filter-item');
            bandwidthContainer.querySelectorAll('.option').forEach(btn => btn.classList.remove('isActive'));
            // 添加active类到当前按钮
            element.classList.add('isActive');
            
            currentSelection.bandwidth = bandwidth;
        }

        // 选择电视
        function selectTV(tv, element) {
            document.querySelectorAll('.filter-item:nth-of-type(3) .option').forEach(btn => btn.classList.remove('isActive'));
            element.classList.add('isActive');
            currentSelection.tv = tv;
        }

        // 选择屏幕定制
        function selectScreen(screen, element) {
            document.querySelectorAll('.filter-item:nth-of-type(4) .option').forEach(btn => btn.classList.remove('isActive'));
            element.classList.add('isActive');
            currentSelection.screen = screen;
        }

        // 更新带宽选项状态
        function updateBandwidthOptions() {
            const currentPackageType = currentSelection.packetType;
            const currentPrice = currentSelection.price;
            
            // 获取当前价格对应的可用带宽
            const availableBandwidths = skuConfig[currentPackageType][currentPrice.toString()] || [];
            
            console.log('更新带宽选项:', {
                packageType: currentPackageType,
                price: currentPrice,
                availableBandwidths: availableBandwidths
            });
            
            // 找到带宽选择区域
            let bandwidthContainer = null;
            document.querySelectorAll('.filter-item').forEach(item => {
                const label = item.querySelector('.label');
                if (label && label.textContent === '带宽') {
                    bandwidthContainer = item;
                }
            });
            
            if (!bandwidthContainer) {
                console.error('未找到带宽选择区域');
                return;
            }
            
            // 更新所有带宽按钮状态
            const bandwidthOptions = bandwidthContainer.querySelectorAll('.option');
            bandwidthOptions.forEach(btn => {
                const bandwidth = btn.textContent.trim();
                
                if (availableBandwidths.includes(bandwidth)) {
                    // 可用带宽
                    btn.classList.remove('disabled');
                    btn.style.opacity = '1';
                    btn.style.cursor = 'pointer';
                    console.log('带宽可用:', bandwidth);
                } else {
                    // 不可用带宽
                    btn.classList.add('disabled');
                    btn.style.opacity = '0.4';
                    btn.style.cursor = 'not-allowed';
                    console.log('带宽不可用:', bandwidth);
                    
                    // 如果当前选中的带宽不可用，清除选中状态
                    if (btn.classList.contains('isActive')) {
                        btn.classList.remove('isActive');
                    }
                }
            });
            
            // 如果当前没有选中的带宽，自动选择第一个可用的
            const activeBandwidth = bandwidthContainer.querySelector('.option.isActive');
            if (!activeBandwidth || activeBandwidth.classList.contains('disabled')) {
                const firstAvailable = bandwidthContainer.querySelector('.option:not(.disabled)');
                if (firstAvailable) {
                    firstAvailable.classList.add('isActive');
                    currentSelection.bandwidth = firstAvailable.textContent.trim();
                    console.log('自动选择带宽:', currentSelection.bandwidth);
                }
            }
        }

        // 提交预约
        function submitReservation() {
            console.log('=== 点击确认按钮 ===');
            console.log('当前选择:', currentSelection);
            
            // 验证必填项
            if (!currentSelection.bandwidth) {
                alert('请选择带宽');
                return;
            }
            
            console.log('验证通过，准备从底部弹出信息填写页面');
            
            // 向父窗口发送选择数据
            if (window.parent && window.parent !== window) {
                console.log('向父窗口发送选择数据:', currentSelection);
                window.parent.postMessage({
                    type: 'updateSelection',
                    selection: currentSelection
                }, '*');
            }
            
            // 显示信息填写弹窗（从底部弹出效果）
            showInfoFormModal();
        }

        // 显示信息填写弹窗
        function showInfoFormModal() {
            console.log('显示信息填写弹窗');
            console.log('当前选择:', currentSelection);
            
            // 隐藏规格选择弹窗
            document.querySelector('.popup-container').style.display = 'none';
            
            // 创建iframe来加载信息填写页面
            const modal = document.getElementById('infoFormModal');
            const iframe = document.createElement('iframe');
            iframe.src = '智慧酒店包信息填写页面.html';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
            iframe.style.borderRadius = '20px 20px 0 0';
            
            // 清空现有内容并添加iframe
            modal.innerHTML = '';
            modal.appendChild(iframe);
            
            // 显示弹窗
            modal.classList.add('show');
            
            // 监听iframe加载完成
            iframe.onload = function() {
                console.log('=== 信息填写页面已加载 ===');
                console.log('准备发送的选择数据:', currentSelection);
                console.log('数据JSON字符串:', JSON.stringify(currentSelection));
                
                // 将选择数据传递给iframe
                const selectionData = encodeURIComponent(JSON.stringify(currentSelection));
                console.log('编码后的数据:', selectionData);
                
                const message = {
                    type: 'updateSelection',
                    data: selectionData
                };
                console.log('发送的消息:', message);
                
                iframe.contentWindow.postMessage(message, '*');
                console.log('消息已发送到iframe');
            };
            
            console.log('信息填写弹窗已显示');
        }

        // 关闭信息填写弹窗
        function closeInfoForm() {
            // 隐藏信息填写弹窗
            document.getElementById('infoFormModal').classList.remove('show');
            
            // 显示规格选择弹窗
            document.querySelector('.popup-container').style.display = 'block';
            
            console.log('返回到规格选择弹窗');
        }

        // 监听来自iframe的消息
        window.addEventListener('message', function(event) {
            console.log('接收到iframe消息:', event.data);
            
            if (event.data.type === 'closeInfoForm') {
                closeInfoForm();
            } else if (event.data.type === 'closeSuccessModal') {
                closeSuccessModal();
            }
        });

        // 更新已选择的产品信息显示
        function updateSelectedProductInfo() {
            const packetTypeText = currentSelection.packetType === 'month' ? '月包' : '年包';
            const currentPrice = currentSelection.packetType === 'month' ? 
                currentSelection.price : 
                currentSelection.price * 10;
            
            // 更新产品规格显示
            document.getElementById('selectedSpec').textContent = packetTypeText;
            
            // 更新价格显示
            document.getElementById('selectedPrice').textContent = `¥${currentPrice}`;
            
            // 更新底部总价显示
            document.getElementById('totalPrice').textContent = `¥${currentPrice}${packetTypeText}`;
            
            // 更新规格详情
            document.getElementById('selectedPacketType').textContent = packetTypeText;
            document.getElementById('selectedBandwidth').textContent = currentSelection.bandwidth;
            document.getElementById('selectedTV').textContent = currentSelection.tv;
            document.getElementById('selectedScreen').textContent = currentSelection.screen;
        }

        // 提交信息表单
        function submitInfoForm() {
            // 获取表单数据
            const city = document.getElementById('citySelect').value.trim();
            const installAddress = document.getElementById('installAddress').value.trim();
            const building = document.getElementById('buildingInput').value.trim();
            const room = document.getElementById('roomInput').value.trim();
            const customerName = document.getElementById('customerName').value.trim();
            const customerPhone = document.getElementById('customerPhone').value.trim();
            const customerRemark = document.getElementById('customerRemark').value.trim();

            // 验证必填项
            if (!installAddress) {
                alert('请填写安装地址');
                return;
            }
            if (!building || !room) {
                alert('请填写详细地址');
                return;
            }
            if (!customerName) {
                alert('请填写姓名');
                return;
            }
            if (!customerPhone) {
                alert('请填写联系电话');
                return;
            }

            // 验证手机号格式
            const phoneRegex = /^1[3-9]\d{9}$/;
            if (!phoneRegex.test(customerPhone)) {
                alert('请输入正确的手机号码');
                return;
            }

            // 合并所有数据
            const completeData = {
                ...currentSelection,
                city,
                installAddress,
                detailAddress: `${building}-${room}`,
                building,
                room,
                customerName,
                customerPhone,
                customerRemark
            };

            console.log('完整预约信息:', completeData);

            // 隐藏信息填写弹窗
            document.getElementById('infoFormModal').classList.remove('show');
            
            // 显示成功弹窗
            document.getElementById('successModal').classList.add('show');
        }

        // 关闭弹窗
        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('=== 智慧酒店包规格选择弹窗已加载 ===');
            console.log('弹窗URL:', window.location.href);
            console.log('是否在iframe中:', window.self !== window.top);
            
            // 添加淡入动画
            const modalContent = document.querySelector('.modal-content');
            if (modalContent) {
                modalContent.classList.add('fade-in');
            }
            
            // 检查价格选项容器是否存在
            const priceContainer = document.getElementById('priceOptions');
            console.log('价格选项容器检查:', priceContainer);
            
            // 初始化价格选项
            console.log('开始初始化价格选项...');
            updatePriceOptions();
            
            // 初始化套餐选项
            initPackageOptions();
            
            // 初始化选择监听
            initSelectionListeners();
            
            console.log('页面初始化完成');
        });

        // 关闭弹窗并返回详情页
        function closeModal() {
            console.log('=== 关闭规格选择弹窗，返回详情页 ===');
            console.log('是否在iframe中:', window.self !== window.top);
            console.log('是否有父窗口:', window.parent !== window);
            
            // 如果在iframe中，向父窗口发送消息关闭弹窗
            if (window.self !== window.top && window.parent) {
                console.log('向父窗口发送关闭消息');
                try {
                    window.parent.postMessage({ type: 'closeModal' }, '*');
                    console.log('关闭消息已发送');
                } catch (error) {
                    console.error('发送关闭消息失败:', error);
                }
            } else {
                // 否则，尝试直接关闭弹窗或导航回详情页
                console.log('不在iframe中，尝试关闭弹窗');
                const modal = document.getElementById('specModal');
                if (modal) {
                    modal.classList.remove('show');
                } else {
                    // 如果没有弹窗元素，尝试直接导航回详情页
                    console.log('尝试直接导航回详情页');
                    const detailPageUrl = window.location.pathname.replace('智慧酒店包规格选择弹窗.html', '智慧酒店包产品详情页.html');
                    window.location.href = detailPageUrl;
                }
            }
        }

        // 返回按钮事件
        function setupBackButton() {
            const backButton = document.querySelector('.close-btn');
            if (backButton) {
                backButton.addEventListener('click', function(e) {
                    e.preventDefault();
                    console.log('点击了返回按钮');
                    closeModal();
                });
            } else {
                console.log('未找到返回按钮元素');
                // 尝试查找类似的关闭按钮
                const closeButtons = document.querySelectorAll('.remove-btn, .close-icon');
                closeButtons.forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        console.log('点击了关闭按钮');
                        closeModal();
                    });
                });
            }
        }

        // 为确认按钮添加正确的事件处理
        function setupConfirmButton() {
            const confirmButton = document.querySelector('.btn-confirm');
            if (confirmButton) {
                confirmButton.addEventListener('click', function() {
                    console.log('点击了确认选择按钮');
                    
                    // 获取当前选择的套餐信息
                    const selectedInfo = getSelectedInfo();
                    console.log('选中的信息:', selectedInfo);
                    
                    // 向父窗口发送选择信息
                    if (window.self !== window.top && window.parent) {
                        console.log('向父窗口发送选择信息');
                        window.parent.postMessage({
                            type: 'updateSelection',
                            selection: selectedInfo
                        }, '*');
                    } else {
                        // 不在iframe中时，直接更新选择信息
                        updateSelectedInfo(selectedInfo);
                    }
                    
                    // 关闭弹窗
                    closeModal();
                });
            }
        }

        // 初始化选择监听
        function initSelectionListeners() {
            // 设置返回按钮功能
            setupBackButton();
            
            // 设置确认按钮功能
            setupConfirmButton();
            
            // 添加点击弹窗外部关闭功能
            const modal = document.getElementById('specModal');
            if (modal) {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        console.log('点击了弹窗外部');
                        closeModal();
                    }
                });
            }
        }

        // 键盘事件监听 - ESC键关闭弹窗
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                console.log('按下ESC键关闭弹窗');
                closeModal();
            }
        });

        // 获取选中的信息
        function getSelectedInfo() {
            const packageType = document.querySelector('.package-type-btn.active')?.getAttribute('data-type') || 'month';
            const bandwidth = document.querySelector('.bandwidth-btn.active')?.textContent || '100M';
            const tv = document.querySelector('.tv-btn.active')?.textContent || '商务电视IPTV';
            const screen = document.querySelector('.screen-btn.active')?.textContent || '屏幕定制标准版';
            
            // 根据套餐类型和带宽计算价格
            let price = 40;
            if (bandwidth.includes('200')) price = 50;
            else if (bandwidth.includes('300')) price = 80;
            else if (bandwidth.includes('600')) price = 100;
            else if (bandwidth.includes('1000')) price = 120;
            
            return {
                packetType: packageType,
                bandwidth: bandwidth,
                tv: tv,
                screen: screen,
                price: price
            };
        }

        // 显示信息填写弹窗
        function showInfoForm() {
            console.log('=== 显示信息填写弹窗 ===');
            const infoModal = document.getElementById('infoModal');
            if (infoModal) {
                infoModal.classList.add('show');
            } else {
                console.log('未找到信息填写弹窗元素');
            }
        }

        // 关闭信息填写弹窗
        function closeInfoForm() {
            console.log('=== 关闭信息填写弹窗 ===');
            const infoModal = document.getElementById('infoModal');
            if (infoModal) {
                infoModal.classList.remove('show');
            }
        }

        // 提交信息表单
        function submitInfoForm() {
            console.log('=== 提交信息表单 ===');
            
            // 获取表单数据
            const name = document.getElementById('contactName')?.value || '';
            const phone = document.getElementById('contactPhone')?.value || '';
            const hotel = document.getElementById('hotelName')?.value || '';
            const address = document.getElementById('hotelAddress')?.value || '';
            const roomCount = document.getElementById('roomCount')?.value || '';
            const notes = document.getElementById('notes')?.value || '';
            
            console.log('表单数据:', {
                name: name,
                phone: phone,
                hotel: hotel,
                address: address,
                roomCount: roomCount,
                notes: notes
            });
            
            // 表单验证
            if (!name || !phone || !hotel || !address || !roomCount) {
                alert('请填写完整的预约信息');
                return;
            }
            
            // 关闭表单弹窗
            closeInfoForm();
            
            // 模拟表单提交成功
            setTimeout(function() {
                alert('预约提交成功！客服将尽快与您联系。');
                closeModal(); // 提交成功后关闭主弹窗
            }, 500);
        }

        // 初始化套餐选项
        function initPackageOptions() {
            // 初始化所有选择按钮
            initSelectionButtons('.package-type-btn');
            initSelectionButtons('.bandwidth-btn');
            initSelectionButtons('.tv-btn');
            initSelectionButtons('.screen-btn');
        }

        // 初始化选择按钮
        function initSelectionButtons(selector) {
            const buttons = document.querySelectorAll(selector);
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    // 移除所有同类型按钮的active类
                    document.querySelectorAll(selector).forEach(btn => {
                        btn.classList.remove('active');
                    });
                    // 添加active类到当前按钮
                    this.classList.add('active');
                    
                    // 更新选择信息
                    updateSelectedInfoDisplay();
                });
            });
        }

        // 更新选择信息显示
        function updateSelectedInfoDisplay() {
            const selectedInfo = getSelectedInfo();
            const selectedInfoElement = document.getElementById('selectedInfo');
            
            if (selectedInfoElement) {
                selectedInfoElement.innerHTML = `
                    <div class="info-row">套餐类型：${selectedInfo.packetType === 'month' ? '月套餐' : '年套餐'}</div>
                    <div class="info-row">带宽：${selectedInfo.bandwidth}</div>
                    <div class="info-row">电视：${selectedInfo.tv}</div>
                    <div class="info-row">屏幕定制：${selectedInfo.screen}</div>
                    <div class="info-row">价格：${selectedInfo.packetType === 'month' ? selectedInfo.price : selectedInfo.price * 10}元</div>
                `;
            }
        }

        // 更新选择信息（在非iframe模式下使用）
        function updateSelectedInfo(selection) {
            // 实际项目中这里会更新主页面的选择信息
            console.log('更新选择信息:', selection);
        }

        // 自动检测并添加缺失的返回按钮
        function checkAndAddBackButton() {
            // 检查是否已经有返回按钮
            const existingBackButton = document.querySelector('.close-btn, .remove-btn');
            if (!existingBackButton) {
                console.log('未找到返回按钮，尝试添加');
                // 查找合适的位置添加返回按钮
                const modalHeader = document.querySelector('.modal-header');
                if (modalHeader) {
                    const backButton = document.createElement('button');
                    backButton.className = 'close-btn';
                    backButton.textContent = '×';
                    backButton.style.cssText = `
                        position: absolute;
                        top: 10px;
                        right: 10px;
                        font-size: 24px;
                        background: none;
                        border: none;
                        cursor: pointer;
                        color: #666;
                        width: 30px;
                        height: 30px;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    `;
                    backButton.addEventListener('click', function() {
                        closeModal();
                    });
                    modalHeader.appendChild(backButton);
                    console.log('已添加返回按钮');
                }
            }
        }

        // 页面加载完成后执行检查
        document.addEventListener('DOMContentLoaded', function() {
            // 确保所有初始化完成后再检查返回按钮
            setTimeout(checkAndAddBackButton, 100);
        });
    </script>
</body>
</html>
